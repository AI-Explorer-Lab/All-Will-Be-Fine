server {
    listen 80;
    listen [::]:80;
    server_name ai-explorer.cloud www.ai-explorer.cloud 122.51.35.170;

    access_log /var/log/nginx/ai-explorer.cloud.access.log;
    error_log /var/log/nginx/ai-explorer.cloud.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    location = /api {
        proxy_pass http://127.0.0.1:8002/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /all-will-be-fine {
        return 301 /all-will-be-fine/;
    }

    location = /all-will-be-fine/ {
        root /home/ubuntu/projects/all-will-be-fine/frontend;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /all-will-be-fine/index.html {
        root /home/ubuntu/projects/all-will-be-fine/frontend;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /all-will-be-fine/monitor {
        return 301 /all-will-be-fine/monitor/;
    }

    location = /all-will-be-fine/monitor/ {
        root /home/ubuntu/projects/all-will-be-fine/frontend/monitor;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /all-will-be-fine/monitor/index.html {
        root /home/ubuntu/projects/all-will-be-fine/frontend/monitor;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location ^~ /all-will-be-fine/monitor/ {
        alias /home/ubuntu/projects/all-will-be-fine/frontend/monitor/;
        index index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /all-will-be-fine/monitor/index.html;
    }

    location ^~ /all-will-be-fine/ {
        alias /home/ubuntu/projects/all-will-be-fine/frontend/;
        index index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /all-will-be-fine/index.html;
    }

    location = / {
        return 302 /all-will-be-fine/;
    }
}
